<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chichecipes</title>
  <meta name="description" content="A cosy little book of handwritten recipes.">
  <meta name="theme-color" content="#24140d">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B1%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Pixelify+Sans:wght@400;600;700&family=Uncial+Antiqua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- the room: a chimney breast above the fireplace, candles on the mantel, a sleepy spider in the corner.
       The cauldron burns low until a recipe is opened. -->
  <div class="scene" aria-hidden="true">
    <div class="wall wall-cool"></div>
    <div class="wall wall-lit"></div>
    <div class="lamp"></div>

    <div class="breast"><div class="bricks bricks-cool"></div><div class="bricks bricks-lit"></div></div>

    <div class="web px"></div>
    <div class="spider-rig">
      <div class="thread"></div>
      <div class="px spider"></div>
      <div class="cglow spider-glow"></div>
    </div>

    <div class="mantel" id="mantel"><div class="beam"></div></div>

    <div class="fireplace">
      <div class="px fp-back"></div>
      <div class="fp-lit"></div>
      <div class="hearth">
        <div class="px pot"></div>
        <div class="fire-glow"></div>
        <div class="fire">
          <div class="px flames-low"></div>
          <div class="px flames"></div>
        </div>
        <div class="px logs"></div>
        <i class="spark k1"></i><i class="spark k2"></i><i class="spark k3"></i><i class="spark k4"></i><i class="spark k5"></i>
      </div>
      <div class="px fp-front"></div>
    </div>

    <div class="glow-wrap"><div class="glow"></div></div>
    <div class="vignette"></div>
  </div>

  <header class="top">
    <h1 class="sign">Chichecipes<i class="chain l"></i><i class="chain r"></i><span class="px cat" role="img" aria-label="A happy black and white cat standing on the sign"></span></h1>
  </header>

  <main class="shelf-wrap" id="shelfWrap">
    <button class="shelf-arrow up" id="shelfUp" type="button" aria-label="Scroll the recipes up" hidden><svg viewBox="0 0 10 6" shape-rendering="crispEdges" aria-hidden="true"><path d="M4 0h2v1h1v1h1v1h1v1h1v2H0V4h1V3h1V2h1V1h1z"/></svg></button>
    <section class="shelf" id="shelf" aria-label="Recipes"><div id="grid" class="grid"></div></section>
    <button class="shelf-arrow down" id="shelfDown" type="button" aria-label="Scroll the recipes down" hidden><svg viewBox="0 0 10 6" shape-rendering="crispEdges" aria-hidden="true"><path d="M0 0h10v2H9v1H8v1H7v1H6v1H4V5H3V4H2V3H1V2H0z"/></svg></button>
  </main>

  <button class="backbtn" id="back" type="button"><svg viewBox="0 0 8 10" shape-rendering="crispEdges" aria-hidden="true"><path d="M5 0h2v2H5zM3 2h2v2H3zM1 4h2v2H1zM3 6h2v2H3zM5 8h2v2H5z"/></svg>All recipes</button>
  <div class="veil" id="veil" hidden></div>
  <div class="stage" id="stage" role="dialog" aria-modal="true" hidden></div>

  <script src="sprites.js"></script>
  <script src="recipes.js"></script>
  <script src="app.js"></script>
</body>
</html>
